<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Operação Marte Zero</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Pixel"; src: url("/fontes/PressStart2P-Regular.ttf") format("truetype"); }
  :root {
    --ceu: #140f26; --ceu2: #1e1838; --ceu3: #281f4a; --borda: #3a2f63; --areia: #f6d7a7;
    --texto: #f3eefe; --texto2: #b9b0d6; --marte: #e2603b; --marte2: #a83d22; --agua: #3fd0c9;
    --ok: #4ed37a; --aviso: #f4b400; --erro: #ff6b6b; --ouro: #ffc83d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ceu); color: var(--texto); font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--agua); }
  .pixel, h1, h2, h3 { font-family: "Pixel", monospace; letter-spacing: .5px; line-height: 1.5; }
  h1 { font-size: 14px; margin: 0; color: var(--areia); }
  h2 { font-size: 13px; margin: 28px 0 12px; color: var(--areia); }
  h3 { font-size: 11px; margin: 0 0 10px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--ceu2); border-bottom: 4px solid var(--borda); }
  .topo { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
  .vivo { font-size: 12px; color: var(--texto2); display: flex; align-items: center; gap: 6px; }
  .vivo i { width: 9px; height: 9px; background: var(--erro); display: inline-block; }
  .vivo.on i { background: var(--ok); }
  .fila-mini { margin-left: auto; font-size: 12px; color: var(--texto2); max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--texto2); padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
  nav button:hover { color: var(--texto); }
  nav button.ativa { color: var(--texto); border-bottom-color: var(--agua); }
  .badge { background: var(--marte); color: #fff; font-size: 11px; padding: 1px 6px; margin-left: 4px; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--ceu2); border: 3px solid var(--borda); padding: 16px; margin-bottom: 14px; }
  .linha { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .mudo { color: var(--texto2); font-size: 13px; }
  .btn { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 0; padding: 8px 14px; color: #fff; background: var(--borda); box-shadow: inset -3px -3px 0 #241c45; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  .btn.aprovar { background: #2b8a52; box-shadow: inset -3px -3px 0 #1d5e38; }
  .btn.publicar { background: var(--marte); box-shadow: inset -3px -3px 0 var(--marte2); }
  .btn.perigo { background: #8a2b2b; box-shadow: inset -3px -3px 0 #5e1d1d; }
  .btn.peq { padding: 4px 9px; font-size: 12px; }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--texto); background: var(--ceu); border: 2px solid var(--borda); padding: 7px 9px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--agua); }
  label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { color: var(--texto2); font-weight: 600; position: sticky; top: 0; background: var(--ceu2); }
  .tabela { overflow-x: auto; max-height: 70vh; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .st { font-size: 11px; font-weight: 700; padding: 2px 7px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
  .st.ok, .st.configurado, .st.aprovado { background: #1f4d33; color: var(--ok); }
  .st.pendente, .st.aguardando { background: #4d3d12; color: var(--aviso); }
  .st.erro, .st.recusado { background: #4d1f1f; color: var(--erro); }
  .st.opcional, .st.neutro { background: var(--ceu3); color: var(--texto2); }
  .st.publicado { background: #4d2a1a; color: var(--ouro); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .kpi { background: var(--ceu); border: 2px solid var(--borda); padding: 12px; }
  .kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--texto2); font-size: 12px; }
  video { width: 100%; max-width: 300px; background: #000; display: block; }
  .ep { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
  @media (max-width: 760px) { .ep { grid-template-columns: 1fr; } }
  pre.log { background: #0b0816; border: 2px solid var(--borda); padding: 10px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 8px 0 0; }
  .chip { display: inline-block; background: var(--ceu3); border: 1px solid var(--borda); padding: 1px 7px; font-size: 12px; margin: 2px 3px 2px 0; }
  .chip button { background: none; border: 0; color: var(--texto2); cursor: pointer; padding: 0 0 0 4px; }
  .aviso { border-left: 4px solid var(--aviso); background: #2a2310; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .erro-box { border-left: 4px solid var(--erro); background: #2a1010; padding: 10px 14px; margin-bottom: 14px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
  .item .txt { flex: 1; min-width: 260px; }
  .item .txt small { display: block; color: var(--texto2); }
  .previa { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .previa iframe { border: 3px solid var(--borda); background: #fff; }
  #toast { position: fixed; bottom: 18px; right: 18px; z-index: 9; display: flex; flex-direction: column; gap: 8px; }
  #toast div { background: var(--ceu3); border-left: 4px solid var(--ok); padding: 10px 14px; max-width: 420px; box-shadow: 4px 4px 0 #0008; }
  #toast div.erro { border-left-color: var(--erro); }
  .contador { font-size: 12px; color: var(--texto2); text-align: right; }
  .contador.passou { color: var(--erro); }
  details summary { cursor: pointer; color: var(--texto2); font-size: 13px; }
  .grade-cad { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
  .cadastro.novo { border-color: var(--ouro, #ffc83d); box-shadow: 0 0 0 1px var(--ouro, #ffc83d); }
  .checklist { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 14px; }
  .checklist .ck-falta { color: #f2b25c; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>OPERAÇÃO MARTE ZERO · PAINEL</h1>
    <span class="vivo" id="vivo"><i></i><span>conectando…</span></span>
    <span class="fila-mini" id="filaMini"></span>
  </div>
  <nav id="abas"></nav>
</header>
<main id="conteudo"></main>
<div id="toast"></div>

<script>
'use strict';
const TOKEN = '__TOKEN__', BOOT = '__BOOT__';
const ABAS = [
  ['aprovacoes', '✅ Aprovações'], ['cadastros', '🆕 Cadastros'], ['episodios', '🎬 Episódios'], ['divulgacao', '📢 Divulgação'],
  ['colonos', '👥 Colonos'], ['visao', '📊 Visão geral'], ['compras', '🛒 Compras'], ['site', '🌐 Site'],
  ['chat', '💬 Chat'], ['produtos', '🏪 Produtos'], ['cargos', '🏅 Cargos'], ['conexoes', '🔌 Conexões'],
];
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reais = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const quando = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const lembrar = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

let aba = location.hash.slice(1) || lembrar('aba') || 'aprovacoes';
if (!ABAS.some(([id]) => id === aba)) aba = 'aprovacoes';
let epDivulgacao = null, filtroColonos = '', filtroStatusColonos = 'todos', filtroCompras = 'pagos';
let jobs = [], ultimoDados = -1, primeiroRecarregar = null, carregando = false, pendente = false;

// ---------------------------------------------------------------- comunicação
async function get(url) {
  const r = await fetch(url);
  const j = await r.json();
  if (!r.ok || j.erro) throw new Error(j.erro || r.statusText);
  return j;
}
async function acao(nome, dados = {}, msg = 'Feito') {
  const r = await fetch('/api/acao', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Painel-Token': TOKEN },
    body: JSON.stringify({ acao: nome, ...dados }),
  });
  const j = await r.json().catch(() => ({ erro: 'resposta inválida' }));
  if (!r.ok || j.erro) { toast(j.erro || 'Erro', true); throw new Error(j.erro); }
  toast(j.msg || msg);
  atualizar(true);
  return j;
}
function toast(texto, erro = false) {
  const d = document.createElement('div');
  d.className = erro ? 'erro' : '';
  d.textContent = texto;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), erro ? 7000 : 3000);
}

// tempo real: o servidor avisa quando algo muda (sem F5)
function conectar() {
  const es = new EventSource('/api/eventos');
  es.onopen = () => { $('#vivo').className = 'vivo on'; $('#vivo span').textContent = 'ao vivo'; };
  es.onerror = () => { $('#vivo').className = 'vivo'; $('#vivo span').textContent = 'reconectando…'; };
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.boot !== BOOT) return location.reload();          // servidor reiniciou (código mudou)
    if (primeiroRecarregar === null) primeiroRecarregar = m.recarregar;
    else if (m.recarregar !== primeiroRecarregar) return location.reload();  // painel.html mudou
    jobs = m.jobs;
    desenharFila();
    if (m.dados !== ultimoDados) { ultimoDados = m.dados; atualizar(); }
  };
}

function desenharFila() {
  const rodando = jobs.find((j) => j.status === 'rodando');
  const fila = jobs.filter((j) => j.status === 'na fila').length;
  $('#filaMini').textContent = rodando ? `⚙️ ${rodando.titulo}: ${rodando.log.at(-1) || 'começando…'}` + (fila ? ` (+${fila} na fila)` : '') : (fila ? `${fila} na fila` : '');
  const box = $('#logsFila');
  if (box) box.innerHTML = htmlFila();
}
function htmlFila() {
  if (!jobs.length) return '<p class="mudo">Nenhum trabalho ainda.</p>';
  return jobs.map((j) => `<details ${j.status === 'rodando' ? 'open' : ''}><summary><span class="st ${j.status === 'ok' ? 'ok' : j.status === 'erro' ? 'erro' : 'pendente'}">${esc(j.status)}</span> ${esc(j.titulo)} · ${quando(j.inicio)}</summary><pre class="log">${esc(j.log.join('\n'))}</pre></details>`).join('');
}

// ---------------------------------------------------------------- abas
function desenharAbas(badge = null) {
  $('#abas').innerHTML = ABAS.map(([id, nome]) =>
    `<button class="${id === aba ? 'ativa' : ''}" data-aba="${id}">${nome}${id === 'aprovacoes' && badge ? `<span class="badge">${badge}</span>` : ''}</button>`).join('');
}
$('#abas').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-aba]');
  if (b) irPara(b.dataset.aba);
});
function irPara(id, extra) {
  aba = id; location.hash = id; lembrar('aba', id);
  if (extra && extra.ep) epDivulgacao = extra.ep;
  $('#conteudo').innerHTML = '<p class="mudo">Carregando…</p>';
  desenharAbas(contagemAprov);
  atualizar(true);
}

let contagemAprov = 0;
async function atualizar(forcar = false) {
  // não atrapalha quem está digitando: espera sair do campo
  const foco = document.activeElement;
  if (!forcar && foco && foco.closest('#conteudo') && /INPUT|TEXTAREA|SELECT/.test(foco.tagName)) { pendente = true; return; }
  if (carregando) { pendente = true; return; }
  carregando = true;
  try {
    const r = await RENDER[aba]();
    if (aba !== 'aprovacoes') get('/api/aprovacoes').then((a) => { contagemAprov = a.pendentes.length; desenharAbas(contagemAprov); }).catch(() => {});
    return r;
  } catch (e) {
    $('#conteudo').innerHTML = `<div class="erro-box">Erro ao carregar: ${esc(e.message)}</div>`;
  } finally {
    carregando = false;
    if (pendente) { pendente = false; setTimeout(() => atualizar(), 300); }
  }
}
document.addEventListener('focusout', () => { if (pendente) setTimeout(() => atualizar(), 200); });

// troca só os pedaços que mudaram (o vídeo não reinicia e o que você digita não some)
function remendar(html) {
  const novo = document.createElement('div');
  novo.innerHTML = html;
  const atual = $('#conteudo');
  const blocosNovos = [...novo.children];
  if (atual.children.length !== blocosNovos.length || [...atual.children].some((c, i) => c.dataset.k !== blocosNovos[i].dataset.k)) {
    atual.replaceChildren(...blocosNovos);
    return;
  }
  blocosNovos.forEach((b, i) => { if (atual.children[i].dataset.h !== b.dataset.h) atual.children[i].replaceWith(b); });
}
function bloco(k, html, tag = 'section') {
  let h = 0; for (let i = 0; i < html.length; i++) h = (h * 31 + html.charCodeAt(i)) | 0;
  return `<${tag} data-k="${esc(k)}" data-h="${h}">${html}</${tag}>`;
}

// clique em qualquer botão com data-acao
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-acao]');
  if (!b) return;
  const d = JSON.parse(b.dataset.dados || '{}');
  if (b.dataset.confirma && !confirm(b.dataset.confirma)) return;
  b.disabled = true;
  try { await acao(b.dataset.acao, d, b.dataset.msg); } catch { } finally { b.disabled = false; }
});
const botao = (rotulo, acaoNome, dados = {}, cls = '', extra = '') =>
  `<button class="btn ${cls}" data-acao="${acaoNome}" data-dados='${esc(JSON.stringify(dados))}' ${extra}>${rotulo}</button>`;

// ================================================================ APROVAÇÕES
async function rAprovacoes() {
  const a = await get('/api/aprovacoes');
  contagemAprov = a.pendentes.length; desenharAbas(contagemAprov);
  const botoesPend = (i) => {
    if (i.tipo === 'episodio') return `<button class="btn" onclick="irPara('episodios')">Assistir</button>${botao('Aprovar', 'aprovar_episodio', { numero: i.id }, 'aprovar')}`;
    if (i.tipo === 'copy') return `<button class="btn" onclick="irPara('divulgacao',{ep:${i.id}})">Revisar</button>${botao('Aprovar', 'aprovar_copy', { numero: i.id, plataforma: i.plataforma }, 'aprovar')}`;
    if (i.tipo === 'site') return `<button class="btn" onclick="irPara('site')">Ver mudanças</button>${botao('Aprovar', 'aprovar_site', {}, 'aprovar')}`;
    if (i.tipo === 'resgate') return botao('Aprovar', 'resgate', { id: i.id, status: 'aprovado' }, 'aprovar') + botao('Recusar', 'resgate', { id: i.id, status: 'recusado' }, 'perigo') + botao('Recusar e liberar', 'resgate', { id: i.id, status: 'recusado', liberar: true }, '', 'title="Apaga o pedido para a pessoa tentar outro nome"');
    if (i.tipo === 'colono') return botao('Nome ok', 'aprovar_colono', { codigo: i.id }, 'aprovar') + botao('Ocultar', 'colono', { codigo: i.id, oculto: true }, 'perigo', 'data-confirma="Ocultar este colono do site e dos vídeos?"');
    if (i.tipo === 'conferir') return `<button class="btn" onclick="irPara('episodios')">Ver log</button>${botaoLiberar(i.id, i.plataforma)}`;
    return '';
  };
  const botoesPub = (i) => {
    if (i.tipo === 'episodio') return `${botao('Desaprovar', 'desaprovar_episodio', { numero: i.id })}${botao('Publicar', 'publicar_episodio', { numero: i.id }, 'publicar', `data-confirma="Registrar o episódio ${i.id} como publicado? Isso grava no banco (vira o corte dos próximos episódios) e cria os links rastreáveis. Depois use 📤 Publicar nas redes."`)}`;
    if (i.tipo === 'copy') return botao('📤 Publicar', 'postar_redes', { numero: i.id, redes: [i.plataforma] }, 'publicar',
      `data-confirma="${esc(confirmaPostar(i.id, [i.plataforma], false))}"`) +
      `<button class="btn" onclick="irPara('divulgacao',{ep:${i.id}})">Postei à mão</button>`;
    if (i.tipo === 'site') return botao('Publicar site', 'publicar_site', {}, 'publicar', 'data-confirma="Enviar o site para o GitHub? A Vercel publica em 1–2 min."');
    return '';
  };
  const lista = (itens, fn, vazio) => itens.length ? itens.map((i) =>
    `<div class="item"><div class="txt"><b>${esc(i.titulo)}</b><small>${esc(i.detalhe)}</small></div><div class="linha">${fn(i)}</div></div>`).join('') : `<p class="mudo">${vazio}</p>`;
  remendar(
    bloco('pend', `<h2>Aguardando sua aprovação (${a.pendentes.length})</h2><div class="card">${lista(a.pendentes, botoesPend, 'Nada para aprovar. 🎉')}</div>`) +
    bloco('pub', `<h2>Aprovados, aguardando publicar (${a.prontos.length})</h2><div class="card"><p class="mudo">Nada publica sozinho: cada item só vai ao ar quando você clica em Publicar.</p>${lista(a.prontos, botoesPub, 'Nenhum item aprovado esperando.')}</div>`) +
    bloco('fila', `<h2>Fila de produção</h2><div class="card" id="logsFila">${htmlFila()}</div>`)
  );
}

// ================================================================ REDES (postagem automática)
const REDES = [['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['youtube', 'YouTube']];
const ROT_REDE = Object.fromEntries(REDES);
const ST_REDE = {
  pendente: ['neutro', '—'], erro: ['erro', '✖ falhou antes de publicar'], enviando: ['pendente', '⏳ enviando'],
  publicado: ['publicado', '✅'], agendado: ['aprovado', '🕒 agendado'], conferir: ['erro', '⚠ conferir'],
};
const TRAVADOS = ['enviando', 'publicado', 'agendado', 'conferir'];
function chipRede(r, s) {
  const [cls, txt] = ST_REDE[s.status] || ['neutro', s.status];
  const hora = s.status === 'agendado' && s.publicar_em ? ' ' + quando(s.publicar_em) : '';
  const dica = [s.detalhe, s.em && 'em ' + quando(s.em), s.ultimo_ensaio && `ensaio ${quando(s.ultimo_ensaio)}: ${s.ultimo_ensaio_resultado || ''}`].filter(Boolean).join(' · ');
  return `<span class="st ${cls}" title="${esc(dica)}">${esc(ROT_REDE[r])} ${esc(txt)}${esc(hora)}</span>`;
}
const botaoLiberar = (n, r) => botao('Liberar', 'liberar_rede', { numero: n, plataforma: r }, 'peq perigo',
  `data-confirma="${esc(`Liberar o ${ROT_REDE[r]} do episódio ${n} para postar de novo?\n\nSó faça isso DEPOIS de abrir o app e conferir que o vídeo NÃO foi publicado (ou que você apagou o post). Senão vai sair duplicado.`)}"`);
function confirmaPostar(n, redes, ensaio) {
  const nomes = redes.map((r) => ROT_REDE[r]).join(', ');
  if (ensaio) return `ENSAIO do episódio ${n} em ${nomes}: faz tudo (celular, legenda, n8n) MENOS o toque final de publicar. Nada vai ao ar.`;
  return `Publicar o episódio ${n} em ${nomes}?\n\n` +
    (redes.some((r) => r !== 'youtube') ? '• Instagram/TikTok: o celular precisa estar no USB, desbloqueado.\n' : '') +
    (redes.includes('youtube') ? '• YouTube: envia ao n8n e agenda para daqui a 30 min.\n' : '') +
    '\nSe algo falhar depois do toque final, a rede fica "⚠ conferir" e não é reenviada sozinha.';
}
window.postarRedes = (n, ensaio) => {
  const redes = REDES.map(([r]) => r).filter((r) => $(`#rd-${n}-${r}`)?.checked);
  if (!redes.length) return toast('Marque pelo menos uma rede', true);
  if (!confirm(confirmaPostar(n, redes, ensaio))) return;
  acao('postar_redes', { numero: n, redes, ensaio }, ensaio ? 'Ensaio na fila' : 'Postagem na fila');
};
function blocoRedes(e) {
  const pode = e.aprovado_em && !e.sem_voz && !e.gerando && !e.postando;
  const caixas = REDES.map(([r, nome]) => {
    const s = e.redes[r], copyOk = e.copies_aprovadas[r], travado = TRAVADOS.includes(s.status);
    const marcar = copyOk && !travado;
    return `<label class="chk" title="${copyOk ? '' : 'aprove a copy na aba Divulgação'}"><input type="checkbox" id="rd-${e.numero}-${r}" ${marcar ? 'checked' : ''} ${copyOk ? '' : 'disabled'}> ${nome}${copyOk ? '' : ' (copy não aprovada)'}</label>`;
  }).join('');
  return `<div style="margin-top:12px;border-top:1px solid var(--borda);padding-top:12px">
    <div class="linha"><b>Redes:</b> ${REDES.map(([r]) => chipRede(r, e.redes[r]) + (e.redes[r].status !== 'pendente' && e.redes[r].status !== 'erro' ? botaoLiberar(e.numero, r) : '')).join(' ')}</div>
    <div class="linha" style="margin-top:8px">${caixas}

      <button class="btn" onclick="postarRedes(${e.numero}, true)" ${pode ? '' : 'disabled'} title="Faz tudo menos o toque final">🧪 Ensaio</button>
      ${e.postando ? '<span class="st pendente">postando…</span>' : ''}</div>
    <p class="mudo">Instagram e TikTok pelo celular (ADB), YouTube pelo n8n (agenda +30 min). O log aparece ao vivo na Fila de produção.
      Rede com ✅, 🕒 ou ⚠ não é reenviada sozinha: confira no app e use Liberar.</p></div>`;
}

// o que vai no episódio + ganchos (o texto editável fica na aba Divulgação)
const GANCHOS = [['historia', '➡️ Gancho da história (próximo episódio)'], ['comentar', '💬 Comentar (pergunta do dia)'],

// ================================================================ EPISÓDIOS

      <button class="btn publicar" onclick="gerarEp()">▶ Gerar episódio</button></div>
      <p class="mudo">Roda a fábrica inteira (coleta no Supabase → roteiro → voz → filmagem → montagem) em segundo plano, uns 5 minutos. Ao terminar, gera as copies e o vídeo aparece aqui para aprovar.</p></div>`;
  const cards = d.episodios.map((e) => {
    const estado = e.publicado_em ? '<span class="st publicado">publicado</span>' : e.aprovado_em ? '<span class="st aprovado">aprovado</span>' : e.video ? '<span class="st aguardando">aguardando aprovação</span>' : '<span class="st neutro">sem vídeo</span>';
    return bloco('ep' + e.numero, `<div class="card"><div class="ep">
      <div>${e.video ? `<video controls preload="metadata" src="${e.video}"></video>` : '<p class="mudo">Ainda sem vídeo.</p>'}</div>
      <div><h3>${esc(e.titulo)}</h3>
        <div class="linha">${estado}${e.sem_voz ? '<span class="st pendente">prévia sem voz</span>' : ''}${e.gerando ? '<span class="st pendente">gerando…</span>' : ''}
        <span class="mudo">${e.duracao ? Math.round(e.duracao) + ' s · ' : ''}gerado ${quando(e.gerado_em)}</span></div>
        <details style="margin:12px 0"><summary>Roteiro (${e.falas.length} falas)</summary><ol>${e.falas.map((f) => `<li><b>${esc(f.id)}</b>: ${esc(f.fala)}</li>`).join('')}</ol></details>
        ${e.resumo ? resumoEpisodio(e) : ''}
        <div class="linha">
          ${e.aprovado_em ? botao('Desaprovar', 'desaprovar_episodio', { numero: e.numero }) : botao('✅ Aprovar', 'aprovar_episodio', { numero: e.numero }, 'aprovar', e.video && !e.gerando ? '' : 'disabled')}
          ${botao('🚀 Publicar', 'publicar_episodio', { numero: e.numero }, 'publicar',
            (e.aprovado_em && !e.publicado_em && !e.sem_voz && !e.gerando ? '' : 'disabled ') + `data-confirma="Registrar o episódio ${e.numero} como publicado? Grava no Supabase e cria os links /l/yt-ep…, /l/ig-ep…, /l/tt-ep…. (O 📤 Publicar nas redes também faz isso sozinho se você esquecer.)"`)}
          <button class="btn" onclick="irPara('divulgacao',{ep:${e.numero}})">📢 Copies</button>
          ${botao('↻ Regerar', 'gerar_episodio', { numero: e.numero, sem_voz: e.sem_voz }, '', `data-confirma="Gerar o episódio ${e.numero} de novo? A aprovação atual é desfeita."` + (e.gerando ? ' disabled' : ''))}
        </div>
        ${e.publicado_em ? `<p class="mudo">Registrado como publicado em ${quando(e.publicado_em)}</p>` : ''}
        ${!e.aprovado_em || e.sem_voz ? '<p class="mudo">Publicar só libera depois de Aprovar (e com voz).</p>' : ''}
        ${e.video ? blocoRedes(e) : ''}
      </div></div>${blocoExtras(e)}</div>`);
  }).join('');

// ---- conteúdo extra: thumbnail, capa, carrossel e vídeos em primeira pessoa (POV)
const CENAS_POV = { obra: '🏗️ Dia de obra', defesa: '🐞 Defendendo a base', passeio: '👋 Passeio pelo bairro', conversa: '💬 Papo na praça' };
function blocoExtras(e) {

  const imgs = x.imagens.map((i) => `<a href="${i.url}" target="_blank" download="${esc(i.nome)}" title="${esc(i.nome)} (clique para abrir/baixar)" style="display:inline-block;margin:4px">
      <img src="${i.url}" alt="${esc(i.nome)}" style="height:${i.nome.startsWith('thumb') ? 90 : 160}px;border:1px solid var(--borda);border-radius:6px"></a>`).join('');

    return `<div class="card" style="display:grid;grid-template-columns:200px 1fr;gap:14px;margin-top:10px">

        <div class="linha">${p.aprovado_em ? '<span class="st aprovado">aprovado</span>' : '<span class="st aguardando">aguardando aprovação</span>'}
          ${['instagram', 'tiktok'].map((r) => chipRede(r, p.redes[r]) + (travado(r) ? botao('Liberar', 'liberar_extra', { numero: e.numero, item: p.item, plataforma: r }, 'peq perigo', 'data-confirma="Você conferiu no app? Liberar deixa postar de novo."') : '')
            + (p.redes[r].status === 'conferir' ? botao('✅ Está no ar', 'marcar_extra_publicado', { numero: e.numero, item: p.item, plataforma: r }, 'peq') : '')).join(' ')}</div>
        <textarea id="leg-${id}" style="width:100%;min-height:90px;margin-top:8px">${esc(p.legenda)}</textarea>
        <div class="linha" style="margin-top:6px">
          ${p.aprovado_em ? botao('Desaprovar', 'desaprovar_extra', { numero: e.numero, item: p.item })
            : `<button class="btn aprovar" onclick="aprovarExtra(${e.numero},'${p.item}')">✅ Aprovar vídeo e legenda</button>`}
          ${['instagram', 'tiktok'].map((r) => `<label class="chk"><input type="checkbox" id="rx-${id}-${r}" ${!travado(r) ? 'checked' : ''} ${p.aprovado_em ? '' : 'disabled'}> ${ROT_REDE[r]}</label>`).join('')}
          <button class="btn publicar" onclick="postarExtra(${e.numero},'${p.item}',false)" ${pode ? '' : 'disabled'}>📤 Publicar</button>
          <button class="btn" onclick="postarExtra(${e.numero},'${p.item}',true)" ${pode ? '' : 'disabled'} title="Faz tudo menos o toque final">🧪 Ensaio</button>
        </div></div></div>`;
  }).join('');
  const car = x.carrossel ? (() => {
    const c = x.carrossel, id = `${e.numero}-carrossel`, travado = TRAVADOS.includes(c.instagram.status);
    const pode = c.aprovado_em && !x.postando && !x.gerando && !travado;
    return `<div class="card" style="margin-top:10px">
      <h4 style="margin:0 0 6px">🖼️ Carrossel do Instagram <span class="mudo">(o botão “Comente no Instagram” do site passa a levar para ele)</span></h4>
      <div class="linha">${c.imagens.map((u) => `<img src="${u}" style="height:150px;border:1px solid var(--borda);border-radius:6px">`).join('')}</div>
      <div class="linha">${c.aprovado_em ? '<span class="st aprovado">aprovado</span>' : '<span class="st aguardando">aguardando aprovação</span>'}
        ${chipRede('instagram', c.instagram)}${travado ? botao('Liberar', 'liberar_extra', { numero: e.numero, item: 'carrossel', plataforma: 'instagram' }, 'peq perigo', 'data-confirma="Você conferiu no app? Liberar deixa postar de novo."') : ''}
        ${c.instagram.status === 'conferir' ? botao('✅ Está no ar', 'marcar_extra_publicado', { numero: e.numero, item: 'carrossel', plataforma: 'instagram' }, 'peq') : ''}</div>
      <textarea id="leg-${id}" style="width:100%;min-height:110px;margin-top:8px">${esc(c.legenda)}</textarea>
      <div class="linha" style="margin-top:6px">
        ${c.aprovado_em ? botao('Desaprovar', 'desaprovar_extra', { numero: e.numero, item: 'carrossel' })
          : `<button class="btn aprovar" onclick="aprovarExtra(${e.numero},'carrossel')">✅ Aprovar imagens e legenda</button>`}
        <button class="btn publicar" onclick="postarCarrossel(${e.numero},false)" ${pode ? '' : 'disabled'}>📤 Publicar no Instagram</button>
        <button class="btn" onclick="postarCarrossel(${e.numero},true)" ${c.aprovado_em && !x.postando ? '' : 'disabled'} title="Faz tudo menos o toque final">🧪 Ensaio</button>
      </div></div>`;
  })() : '';
  return `<div style="margin-top:14px;border-top:1px solid var(--borda);padding-top:12px">
    <div class="linha"><b>Conteúdo extra</b>${gerar}${x.gerando ? '<span class="st pendente">gerando…</span>' : ''}${x.postando ? '<span class="st pendente">postando…</span>' : ''}</div>
    <p class="mudo">Sem IA e sem custo: thumbnail do YouTube, capa dos Reels/TikTok, carrossel do Instagram (clique para baixar) e 4 vídeos em primeira pessoa com um colono de verdade.
      Para postar um POV: confira o vídeo, ajuste a legenda e aprove. Instagram e TikTok vão pelo celular.</p>
    ${imgs ? `<div>${imgs}</div>` : ''}${car}${povs}</div>`;
}
window.aprovarExtra = (n, item) => acao('aprovar_extra', { numero: n, item, legenda: $(`#leg-${n}-${item}`).value }, 'Vídeo aprovado');
window.postarCarrossel = (n, ensaio) => {
  if (!ensaio && !confirm(`Publicar o carrossel do episódio ${n} no Instagram?\n\nO celular precisa estar no USB e desbloqueado.`)) return;
  acao('postar_extra', { numero: n, item: 'carrossel', redes: ['instagram'], ensaio }, ensaio ? 'Ensaio na fila' : 'Postagem na fila');
};
window.postarExtra = (n, item, ensaio) => {
  const redes = ['instagram', 'tiktok'].filter((r) => $(`#rx-${n}-${item}-${r}`)?.checked);
  if (!ensaio && !confirm(`Publicar ${item.replace('pov_', 'POV ')} em ${redes.join(' e ')}?`)) return;
  acao('postar_extra', { numero: n, item, redes, ensaio }, ensaio ? 'Ensaio na fila' : 'Postagem na fila');
};

window.gerarEp = () => acao('gerar_episodio', {
  numero: Number($('#epNum').value), so_fundadores: $('#epFund').checked, sem_voz: $('#epSemVoz').checked,
}, 'Episódio na fila de produção');

// ================================================================ DIVULGAÇÃO
const LIMITES = { titulo: 100, descricao: 5000, legenda: 2200, tags: 500 };
async function rDivulgacao() {
  const eps = (await get('/api/episodios')).episodios.filter((e) => e.copies);
  if (!eps.length) return remendar(bloco('v', '<div class="card"><p class="mudo">Nenhum episódio com copies ainda. Gere um episódio na aba 🎬 Episódios.</p></div>'));
  if (!epDivulgacao || !eps.some((e) => e.numero === epDivulgacao)) epDivulgacao = eps[0].numero;
  const ep = eps.find((e) => e.numero === epDivulgacao);
  const c = await get('/api/copies?ep=' + epDivulgacao);
  const seletor = `<div class="linha"><label>Episódio <select onchange="epDivulgacao=Number(this.value);atualizar(true)">${eps.map((e) => `<option value="${e.numero}" ${e.numero === epDivulgacao ? 'selected' : ''}>${esc(e.titulo)}</option>`).join('')}</select></label>
    ${botao('↻ Gerar copies de novo', 'gerar_copies', { numero: epDivulgacao }, '', 'data-confirma="Gerar as copies de novo a partir dos templates? Suas edições deste episódio serão perdidas."')}
    ${ep.publicado_em ? '<span class="st publicado">episódio publicado</span>' : '<span class="st pendente">episódio ainda não publicado</span>'}</div>`;
  const campos = { youtube: ['titulo', 'descricao', 'tags'], instagram: ['legenda'], tiktok: ['legenda'] };
  const cards = Object.entries(c.copies).map(([p, v]) => bloco('c' + p + epDivulgacao + (v.aprovado_em || '') + (v.postado_url || '') + v.auto.status, `<div class="card" data-plat="${p}">
    <div class="linha" style="justify-content:space-between"><h3>${esc(v.rotulo)}</h3>
      <span>${v.postado_url ? '<span class="st publicado">postado</span>' : v.aprovado_em ? '<span class="st aprovado">aprovada</span>' : '<span class="st aguardando">aguardando aprovação</span>'}
      ${v.auto.status !== 'pendente' ? chipRede(p, v.auto) : ''}</span></div>
    ${v.regras.length ? `<div class="erro-box">Fora das regras (não dá para aprovar): ${esc(v.regras.join('; '))}</div>` : ''}
    ${campos[p].map((k) => `<label class="mudo">${k}</label>${k === 'titulo' || k === 'tags' ? `<input style="width:100%" data-campo="${k}" value="${esc(v[k])}" oninput="contar(this)">` : `<textarea data-campo="${k}" oninput="contar(this)">${esc(v[k])}</textarea>`}
      <div class="contador" data-limite="${LIMITES[k]}">${(v[k] || '').length}/${LIMITES[k]}</div>`).join('')}
    <p class="mudo">Link rastreável: <code>${esc(v.link)}</code>${v.obs ? '<br>' + esc(v.obs) : ''}</p>
    <div class="linha">
      <button class="btn" onclick="copiar('${p}')">📋 Copiar texto</button>
      <button class="btn" onclick="salvarCopy('${p}')">💾 Salvar</button>
      <button class="btn aprovar" onclick="aprovarCopy('${p}')" ${v.aprovado_em ? 'disabled' : ''}>✅ Aprovar</button>
    </div>
    <div class="linha" style="margin-top:12px;border-top:1px solid var(--borda);padding-top:12px">
      ${v.postado_url ? `<span class="mudo">Post: <a href="${esc(v.postado_url)}" target="_blank" rel="noopener">${esc(v.postado_url)}</a></span>` : `
      <input placeholder="Cole aqui o link do post no ${esc(v.rotulo)}" data-url style="flex:1;min-width:220px">
      <button class="btn publicar" onclick="marcarPostado('${p}')" ${v.aprovado_em && ep.publicado_em ? '' : 'disabled title="Aprove a copy e publique o episódio antes"'}>🚀 Publicar (marcar como postado)</button>`}
    </div>
    <p class="mudo">Automático: 📤 Publicar nas redes na aba 🎬 Episódios. Se postar à mão, cole o link do post aqui.
      Regras: menos de 15 hashtags${p === 'youtube' ? '; sem link na descrição enquanto o canal não liberar (YOUTUBE_LINK_NA_DESCRICAO)' : '; sem link na legenda (use “link na bio”)'}.</p></div>`)).join('');
  const r = c.resumo;
  const pauta = r ? bloco('pg' + epDivulgacao + JSON.stringify(r).length, `<div class="card" id="pautaCard">
    <h3>📝 O que vai neste episódio e os ganchos</h3>
    <p class="mudo">Edite aqui e clique em “Refazer as 3 copies”: o título do YouTube e as legendas são montados de novo com isto.
      Ajustes finos de cada rede você faz direto nas copies abaixo (depois de refazer).</p>
    <label class="mudo">Manchete (título do YouTube e 1ª linha do Instagram/TikTok)</label>
    <input style="width:100%" id="pgManchete" maxlength="90" value="${esc(r.manchete)}">
    <label class="mudo">Pauta: o que acontece no episódio (uma linha por momento)</label>
    <textarea id="pgPauta" style="min-height:150px">${esc(r.pauta.join('\n'))}</textarea>
    ${GANCHOS.map(([k, rot]) => `<label class="mudo">${rot}</label><input style="width:100%" data-gancho="${k}" maxlength="300" value="${esc(r.ganchos[k] || '')}">`).join('')}
    <div class="linha" style="margin-top:10px"><button class="btn aprovar" onclick="refazerCopies()">↻ Refazer as 3 copies com isto</button></div></div>`) : '';
  remendar(bloco('sel' + epDivulgacao, seletor) + pauta + bloco('g' + epDivulgacao, `<div class="grade">${cards}</div>`));
  document.querySelectorAll('[data-campo]').forEach(contar);
}
window.contar = (el) => {
  const ct = el.nextElementSibling; const lim = Number(ct.dataset.limite);
  ct.textContent = `${el.value.length}/${lim}`; ct.classList.toggle('passou', el.value.length > lim);
};
const camposDe = (p) => Object.fromEntries([...document.querySelectorAll(`[data-plat="${p}"] [data-campo]`)].map((el) => [el.dataset.campo, el.value]));
window.copiar = async (p) => {
  const c = camposDe(p);
  const texto = p === 'youtube' ? `${c.titulo}\n\n${c.descricao}\n\nTags: ${c.tags}` : c.legenda;
  await navigator.clipboard.writeText(texto); toast('Texto copiado');
};
window.refazerCopies = () => {
  if (!confirm('Refazer as copies do YouTube, Instagram e TikTok com esta pauta e estes ganchos?\n\nEdições feitas direto nas copies serão substituídas e as 3 precisam ser aprovadas de novo.')) return;
  const ganchos = Object.fromEntries([...document.querySelectorAll('[data-gancho]')].map((el) => [el.dataset.gancho, el.value]));
  acao('refazer_copies', { numero: epDivulgacao, manchete: $('#pgManchete').value, pauta: $('#pgPauta').value, ganchos }, 'Copies refeitas: aprove de novo');
};
window.salvarCopy = (p) => acao('salvar_copy', { numero: epDivulgacao, plataforma: p, campos: camposDe(p) }, 'Copy salva (aprove de novo)');
window.aprovarCopy = (p) => acao('aprovar_copy', { numero: epDivulgacao, plataforma: p, campos: camposDe(p) }, 'Copy aprovada');
window.marcarPostado = (p) => acao('marcar_postado', { numero: epDivulgacao, plataforma: p, url: $(`[data-plat="${p}"] [data-url]`).value }, 'Marcado como postado');

// ================================================================ CADASTROS (ao vivo)
// Quem se cadastrou (mais novo primeiro), de onde veio e um checklist por pessoa. O "entrou no vídeo" e o
// "item apareceu" são automáticos (lidos dos episódios publicados); "revisado" e "aviso" são marcados à mão.
let filtroCadastros = 'todos';
async function rCadastros() {
  const d = await get('/api/cadastros');
  const ok = (sim, txt, nao) => `<li class="${sim ? 'ck-ok' : 'ck-falta'}">${sim ? '✅' : '⏳'} ${sim ? txt : (nao || txt)}</li>`;
  const filtros = { todos: () => true, novos: (c) => c.novo, 'fora do vídeo': (c) => !c.auto.casa_ep, 'item sem aparecer': (c) => c.itens.some((i) => i.pago && !i.apareceu_ep) };
  const lista = d.cadastros.filter((c) => !c.oculto && filtros[filtroCadastros](c));
  const item = (i) => {
    if (!i.pago) {
      const st = i.status === 'pendente' ? '⏳ aguardando pagamento: não aparece em lugar nenhum' : `❌ ${esc(i.status)}: não aparece`;
      return `<li class="ck-falta">🛒 <b>${esc(i.produto)}</b> · ${st}</li>`;
    }
    const det = [i.opcao, i.texto && `“${i.texto}”`].filter(Boolean).map(esc).join(' · ');
    return `<li class="${i.apareceu_ep ? 'ck-ok' : 'ck-falta'}">🛒 <b>${esc(i.produto)}</b>${det ? ` (${det})` : ''} · ${String(i.pedido).startsWith('R') ? 'resgate aprovado' : 'pago'} ✅
      ${i.no_site ? '· no site ✅ ' : ''}· ${i.apareceu_ep ? `no vídeo: ep. ${i.apareceu_ep} ✅` : 'no vídeo: ⏳ próximo episódio'}</li>`;
  };
  const cards = lista.map((c) => `<div class="card cadastro${c.novo ? ' novo' : ''}">
    <div class="linha" style="justify-content:space-between">

  const cargoSite = (c) => c.cargo
    ? (site[c.cargo] ? `<span class="chip" title="${esc(site[c.cargo].descricao)}">${esc(site[c.cargo].emoji)} ${esc(site[c.cargo].nome)}</span>` : `<span class="chip">${esc(c.cargo)}</span>`)
    : `<select title="Ainda não escolheu no site. O cargo escolhido não pode ser trocado depois." onchange="if(this.value)acao('cargo_definir',{codigo:'${c.codigo}',cargo:this.value},'Cargo salvo')"><option value="">sem cargo · definir</option>${d.cargos_site.map((x) => `<option value="${x.id}">${esc(x.emoji)} ${esc(x.nome)}</option>`).join('')}</select>`;
  const q = filtroColonos.toLowerCase();

    (!q || [c.codigo, c.nome, c.handle, c.origem_source, c.origem_campaign].some((x) => (x || '').toLowerCase().includes(q))) &&
    (filtroStatusColonos === 'todos' || (filtroStatusColonos === 'ocultos' ? c.oculto : filtroStatusColonos === 'testes' ? c.teste : c.status === filtroStatusColonos)));

    <select onchange="filtroStatusColonos=this.value;atualizar(true)">${['todos', 'fila', 'desenhado', 'estreou', 'ocultos', 'testes'].map((s) => `<option ${s === filtroStatusColonos ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <span class="mudo">${lista.length} de ${d.colonos.length} colonos</span></div>`;

  const linhas = lista.map((c) => `<tr>
    <td><b>${esc(c.codigo)}</b>${c.teste ? '<br><span class="st neutro">teste</span>' : ''}${c.oculto ? '<br><span class="st erro">oculto</span>' : ''}</td>
    <td>${esc(c.nome)}<br><span class="mudo">@${esc(c.handle)} · ${esc(c.handle_plataforma)}</span>${c.compras ? `<br><span class="chip">💎 ${c.compras} compra(s)</span>` : ''}</td>
    <td><select data-cod="${c.codigo}" onchange="acao('colono',{codigo:this.dataset.cod,status:this.value},'Status atualizado')">${['fila', 'desenhado', 'estreou'].map((s) => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
    <td>${origem(c)}</td>
    <td>${c.ultimo_source ? esc(c.ultimo_source) + (c.ultimo_campaign ? ' / ' + esc(c.ultimo_campaign) : '') : '<span class="mudo">—</span>'}</td>
    <td>${d.itens.map(([k, rot]) => `<label class="chk" style="display:flex"><input type="checkbox" ${c.checklist[k] ? 'checked' : ''} ${k === 'aviso' && !c.aceita_whatsapp ? 'disabled title="Não aceitou aviso no WhatsApp"' : ''} onchange="acao('checklist',{codigo:'${c.codigo}',item:'${k}',valor:this.checked},'Checklist salvo')">${esc(rot)}</label>`).join('')}</td>
    <td>${cargoSite(c)}</td>
    <td>${c.cargos.map((id) => cat[id] ? `<span class="chip">${esc(cat[id].emoji)} ${esc(cat[id].nome)}<button title="Tirar" onclick="acao('cargo_atribuir',{codigo:'${c.codigo}',cargo:'${id}',valor:false})">×</button></span>` : '').join('')}
      <select onchange="if(this.value)acao('cargo_atribuir',{codigo:'${c.codigo}',cargo:this.value,valor:true},'Cargo dado')"><option value="">+ distintivo</option>${d.catalogo.filter((x) => !c.cargos.includes(x.id)).map((x) => `<option value="${x.id}">${esc(x.emoji)} ${esc(x.nome)}</option>`).join('')}</select></td>
    <td class="mudo">${quando(c.created_at)}</td>
    <td><label class="chk"><input type="checkbox" ${c.teste ? 'checked' : ''} onchange="acao('teste',{tipo:'personagens',id:'${c.codigo}',valor:this.checked},'Marcação de teste salva')">teste</label>
      <br>${botao(c.oculto ? 'Mostrar' : 'Ocultar', 'colono', { codigo: c.codigo, oculto: !c.oculto }, 'peq ' + (c.oculto ? '' : 'perigo'), c.oculto ? '' : 'data-confirma="Ocultar do site, da busca e dos vídeos?"')}</td></tr>`).join('');
  const temBusca = document.getElementById('buscaColono');
  const tabela = bloco('t', `<div class="card tabela"><table><thead><tr><th>Código</th><th>Colono</th><th>Status</th><th>Origem (1º toque / UTM)</th><th>Último toque</th><th>Checklist</th><th>Cargo</th><th>Distintivos</th><th>Chegou</th><th></th></tr></thead><tbody>${linhas || '<tr><td colspan="10" class="mudo">Ninguém encontrado.</td></tr>'}</tbody></table></div>`);
  if (temBusca) remendar($('#conteudo').children[0].outerHTML + tabela); else remendar(bloco('topo', topo) + tabela);
}

  const grupos = {};
  d.itens.forEach((i) => (grupos[i.grupo] ||= []).push(i));
  remendar(bloco('topo', `<div class="linha">${botao('↻ Testar de novo', 'testar_conexoes', {}, '', 'data-msg="Conexões testadas"')}<span class="mudo">Testado em ${quando(d.testado_em)}. As chaves nunca aparecem aqui: só se estão configuradas.</span></div>`) +
    Object.entries(grupos).map(([g, itens]) => bloco(g, `<h2>${esc(g)}</h2><div class="card">${itens.map((i) => `<div class="item"><div class="txt"><b>${esc(i.nome)}</b><small>${esc(i.detalhe)}</small></div><span class="st ${esc(i.status)}">${esc(i.status)}</span></div>`).join('')}</div>`)).join(''));
}

const RENDER = { aprovacoes: rAprovacoes, cadastros: rCadastros, episodios: rEpisodios, divulgacao: rDivulgacao, colonos: rColonos, visao: rVisao, compras: rCompras, site: rSite, chat: rChat, produtos: rProdutos, cargos: rCargos, conexoes: rConexoes };
window.irPara = irPara; window.acao = acao; window.atualizar = atualizar; window.lembrar = lembrar; window.$ = $;

desenharAbas();
irPara(aba);
conectar();
</script>
